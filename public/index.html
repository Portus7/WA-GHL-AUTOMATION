<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Gestión de Dispositivos - Clic&App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Animaciones suaves */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar fina para contenedores internos si hiciera falta */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>

<body class="min-h-screen text-gray-900 py-8 px-4 flex flex-col items-center">

    <div id="loader-view" class="flex flex-col items-center justify-center mt-32 animate-pulse">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
        <p class="text-gray-500 text-sm font-medium">Cargando...</p>
    </div>

    <div id="app-view" class="w-full max-w-7xl hidden fade-in">

        <div class="flex items-center justify-between mb-6 px-2">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-200">
                    CA
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">Gestión de Dispositivos</h1>
                    <p class="text-xs text-gray-500 font-mono" id="location-display">Cargando ID...</p>
                </div>
            </div>
            <button onclick="location.reload()"
                class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-white rounded-lg transition" title="Recargar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                    <path d="M8 16H3v5" />
                </svg>
            </button>
        </div>

        <div id="slots-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const locationId = params.get("location_id") || params.get("locationId");

        // Configuración Toast
        const Toast = Swal.mixin({
            toast: true, position: 'bottom-end', showConfirmButton: false, timer: 3000,
            timerProgressBar: true, customClass: { popup: 'rounded-xl text-sm font-medium' }
        });

        if (!locationId) {
            document.body.innerHTML = `
                <div class="flex items-center justify-center h-screen">
                    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm mx-4 border border-red-100">
                        <div class="text-red-500 text-4xl mb-3">⚠️</div>
                        <h3 class="text-lg font-bold text-gray-900">Falta Location ID</h3>
                    </div>
                </div>`;
        } else {
            document.getElementById('location-display').textContent = locationId;
        }

        const appView = document.getElementById("app-view");
        const loaderView = document.getElementById("loader-view");
        const container = document.getElementById("slots-container");
        const activeConnections = new Set();
        const connectionIntervals = new Map();
        let ghlUsers = [];

        // Iconos SVG Optimizados
        const ICONS = {
            edit: `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`,
            smartphone: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>`,
            check: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
            trash: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
            qr: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>`,
            user: `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            sort: `<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>`
        };

        async function init() {
            try {
                // 1. Config
                const confRes = await fetch(`/config?locationId=${locationId}`);
                if (!confRes.ok) throw new Error("Error API");
                const conf = await confRes.json();

                if (conf.is_active === false) { showBlockedScreen(conf.reason); return; }

                // 2. Users
                try {
                    const usersRes = await fetch(`/public/ghl-users?locationId=${locationId}`);
                    if (usersRes.ok) ghlUsers = await usersRes.json();
                } catch (e) { }

                loaderView.style.display = "none";
                appView.style.display = "block";

                const slots = conf.slots || [];
                slots.sort((a, b) => (a.priority || 99) - (b.priority || 99));
                renderSlots(slots);

                setInterval(syncAllSlots, 5000);

            } catch (e) {
                console.error(e);
                loaderView.innerHTML = `<p class="text-red-500 font-bold">Error de conexión.</p>`;
            }
        }

        function renderSlots(slotsArray) {
            container.innerHTML = "";
            const totalSlots = slotsArray.length;

            if (totalSlots === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-8 rounded-xl border border-dashed border-gray-300 text-center">
                        <div class="text-gray-300 mb-2">${ICONS.smartphone}</div>
                        <p class="text-gray-500 text-sm">No hay dispositivos configurados.</p>
                    </div>`;
                return;
            }

            slotsArray.forEach(slot => {
                const i = slot.id;
                const currentName = slot.name || `Slot ${i}`;
                const currentPrio = slot.priority || 99;
                const settings = slot.settings || {};
                const currentAssigned = settings.ghl_assigned_user || "";

                // Selectores compactos
                let prioOptions = "";
                for (let p = 1; p <= totalSlots; p++) {
                    const selected = p === currentPrio ? 'selected' : '';
                    prioOptions += `<option value="${p}" ${selected}>${p}</option>`;
                }
                if (currentPrio > totalSlots) prioOptions += `<option value="${currentPrio}" selected>${currentPrio}</option>`;

                let userOptions = `<option value="">Auto</option>`;
                ghlUsers.forEach(u => {
                    const selected = u.id === currentAssigned ? 'selected' : '';
                    userOptions += `<option value="${u.id}" ${selected}>${u.name}</option>`;
                });

                // HTML TARJETA COMPACTA
                const html = `
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all group overflow-hidden flex flex-col" id="card-${i}" data-slot-id="${i}">
                    
                    <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-white border border-gray-200 flex items-center justify-center text-indigo-600 shadow-sm">
                                ${ICONS.smartphone}
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <h3 class="font-bold text-gray-800 text-sm truncate max-w-[120px]" id="title-text-${i}" title="${currentName}">${currentName}</h3>
                                    <button onclick="editSlotName(${i})" class="text-gray-400 hover:text-indigo-600 transition">
                                        ${ICONS.edit}
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div id="badge-${i}" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide bg-gray-100 text-gray-500 border border-gray-200">
                            OFF
                        </div>
                    </div>

                    <div class="px-4 py-3 bg-white border-b border-gray-50">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-2 flex items-center pointer-events-none text-gray-400">${ICONS.sort}</div>
                                <select onchange="changePriority(${i}, this.value)" class="w-full pl-7 pr-2 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-lg text-gray-700 focus:border-indigo-500 outline-none cursor-pointer hover:bg-gray-100 transition" title="Prioridad de Envío">
                                    ${prioOptions}
                                </select>
                            </div>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-2 flex items-center pointer-events-none text-gray-400">${ICONS.user}</div>
                                <select onchange="changeResponsible(${i}, this.value)" class="w-full pl-7 pr-2 py-1.5 text-xs bg-gray-50 border border-gray-200 rounded-lg text-gray-700 focus:border-indigo-500 outline-none cursor-pointer hover:bg-gray-100 transition" title="Usuario Responsable">
                                    ${userOptions}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="connected-view-${i}" style="display:none" class="p-4 flex-1 flex flex-col justify-center animate-in fade-in">
                        <div class="text-center mb-3">
                            <p class="text-lg font-bold text-gray-800 font-mono tracking-tight" id="phone-${i}">...</p>
                            <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider flex items-center justify-center gap-1">
                                ${ICONS.check} Sincronizado
                            </p>
                        </div>
                        <button onclick="disconnect(${i})" class="w-full py-2 border border-red-100 text-red-500 hover:bg-red-50 hover:text-red-600 font-semibold rounded-lg transition text-xs flex items-center justify-center gap-1.5">
                            ${ICONS.trash} Desconectar
                        </button>
                    </div>

                    <div id="disconnected-view-${i}" class="p-4 flex-1 flex flex-col justify-center">
                        <button id="btn-${i}" onclick="startConnect(${i})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg shadow-sm hover:shadow transition-all active:scale-[0.98] text-xs flex items-center justify-center gap-2 h-9">
                            ${ICONS.qr} Vincular
                        </button>
                        
                        <div id="qr-area-${i}" class="hidden flex-col items-center mt-3 animate-in zoom-in-95">
                            <p id="msg-${i}" class="text-[10px] text-gray-500 mb-2 animate-pulse">Generando QR...</p>
                            <div id="qr-canvas-${i}" class="qr-canvas bg-white p-2 rounded-lg shadow-sm border border-gray-200 mb-3"></div>
                            <button onclick="cancelConnect(${i})" class="text-xs text-red-500 hover:text-red-700 font-medium underline">Cancelar</button>
                        </div>
                    </div>
                </div>`;

                container.insertAdjacentHTML('beforeend', html);
                checkStatus(i);
            });
        }

        // --- FUNCIONES (Sin cambios de lógica) ---

        async function changePriority(slotId, newPriority) {
            try { await fetch(`/public/update-slot-config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ locationId, slotId, priority: parseInt(newPriority) }) }); if (true) setTimeout(() => window.location.reload(), 300); }
            catch (e) { Toast.fire({ icon: 'error', title: 'Error' }); }
        }

        async function changeResponsible(slotId, userId) {
            try { const res = await fetch(`/public/update-slot-config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ locationId, slotId, assignedUser: userId }) }); if (res.ok) Toast.fire({ icon: 'success', title: 'Guardado' }); }
            catch (e) { Toast.fire({ icon: 'error', title: 'Error' }); }
        }

        async function editSlotName(slot) {
            const currentName = document.getElementById(`title-text-${slot}`).textContent.trim();
            const { value: newName } = await Swal.fire({
                title: 'Nombre del Slot', input: 'text', inputValue: currentName, showCancelButton: true, confirmButtonText: 'Guardar', confirmButtonColor: '#4f46e5',
                customClass: { popup: 'rounded-xl', confirmButton: 'rounded-lg', cancelButton: 'rounded-lg' }
            });
            if (newName && newName !== currentName) {
                document.getElementById(`title-text-${slot}`).textContent = newName;
                await fetch("/config-slot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ locationId, slot, slotName: newName }) });
            }
        }

        function syncAllSlots() { document.querySelectorAll('[data-slot-id]').forEach(c => { const sid = c.getAttribute('data-slot-id'); if (!activeConnections.has(parseInt(sid))) checkStatus(sid); }); }

        async function checkStatus(slot) {
            try { const r = await fetch(`/status?locationId=${locationId}&slot=${slot}`); const d = await r.json(); updateUI(slot, d.connected, d.myNumber); } catch (e) { }
        }

        function updateUI(slot, isConnected, phone) {
            const badge = document.getElementById(`badge-${slot}`);
            const viewCon = document.getElementById(`connected-view-${slot}`);
            const viewDisc = document.getElementById(`disconnected-view-${slot}`);
            const phoneText = document.getElementById(`phone-${slot}`);
            const qrArea = document.getElementById(`qr-area-${slot}`);
            if (!badge) return;

            if (isConnected) {
                if (badge.innerText !== "ON") {
                    badge.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-100 text-emerald-700 border border-emerald-200";
                    badge.innerText = "ON";
                    viewCon.style.display = "flex"; viewDisc.style.display = "none";
                    qrArea.classList.add("hidden"); qrArea.classList.remove("flex");
                    activeConnections.delete(slot);
                }
                phoneText.textContent = "+" + phone;
            } else {
                if (badge.innerText !== "OFF" && !activeConnections.has(slot)) {
                    badge.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-gray-100 text-gray-500 border border-gray-200";
                    badge.innerText = "OFF";
                    viewCon.style.display = "none"; viewDisc.style.display = "flex";
                }
            }
        }

        async function startConnect(slot) {
            activeConnections.add(slot);
            const btn = document.getElementById(`btn-${slot}`);
            const qrArea = document.getElementById(`qr-area-${slot}`);
            const qrCanvas = document.getElementById(`qr-canvas-${slot}`);

            btn.classList.add("hidden");
            qrArea.classList.remove("hidden");
            qrArea.classList.add("flex");
            qrCanvas.innerHTML = "";

            try {
                const res = await fetch(`/start-whatsapp?locationId=${locationId}&slot=${slot}`, { method: "POST" });
                if (!res.ok) throw new Error("Fallo");

                const localInterval = setInterval(async () => {
                    if (!document.getElementById(`card-${slot}`)) { clearInterval(localInterval); return; }
                    const s = await fetch(`/status?locationId=${locationId}&slot=${slot}`).then(r => r.json());
                    if (s.connected) { clearInterval(localInterval); connectionIntervals.delete(slot); activeConnections.delete(slot); window.location.reload(); return; }
                    const q = await fetch(`/qr?locationId=${locationId}&slot=${slot}`).then(r => r.json());
                    if (q.qr && qrCanvas.innerHTML === "") {
                        document.getElementById(`msg-${slot}`).innerText = "Escanea con WhatsApp";
                        new QRCode(qrCanvas, { text: q.qr, width: 160, height: 160, colorDark: "#1f2937", colorLight: "#ffffff" });
                    }
                }, 2000);
                connectionIntervals.set(slot, localInterval);
            } catch (e) {
                activeConnections.delete(slot);
                btn.classList.remove("hidden"); qrArea.classList.add("hidden"); qrArea.classList.remove("flex");
                Toast.fire({ icon: 'error', title: 'Error de conexión' });
            }
        }

        async function disconnect(slot) {
            const r = await Swal.fire({
                title: '¿Desconectar?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Sí', cancelButtonText: 'No',
                customClass: { popup: 'rounded-xl w-64', title: 'text-lg', confirmButton: 'rounded-lg px-4', cancelButton: 'rounded-lg px-4' }
            });
            if (r.isConfirmed) { await fetch(`/remove-slot?locationId=${locationId}&slot=${slot}`, { method: "POST" }); window.location.reload(); }
        }

        async function cancelConnect(slot) {
            const interval = connectionIntervals.get(slot);
            if (interval) { clearInterval(interval); connectionIntervals.delete(slot); }
            activeConnections.delete(slot);
            document.getElementById(`qr-area-${slot}`).classList.add("hidden");
            document.getElementById(`qr-area-${slot}`).classList.remove("flex");
            document.getElementById(`qr-canvas-${slot}`).innerHTML = "";
            document.getElementById(`btn-${slot}`).classList.remove("hidden");
            await fetch(`/remove-slot?locationId=${locationId}&slot=${slot}`, { method: "POST" });
        }

        function showBlockedScreen(r) {
            document.body.innerHTML = `<div class="fixed inset-0 bg-gray-100 flex items-center justify-center"><div class="bg-white p-8 rounded-2xl shadow-xl text-center"><div class="text-4xl mb-4">🔒</div><h2 class="text-xl font-bold mb-2">Acceso Restringido</h2><p class="text-gray-500 text-sm">Cuenta inactiva (${r})</p></div></div>`;
        }

        init();
    </script>
</body>

</html>
