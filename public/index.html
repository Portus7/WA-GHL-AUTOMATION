<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Gestión de Dispositivos - Clic&App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        indigo: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Ajustes finos que Tailwind CDN a veces necesita */
        body {
            font-family: 'Inter', sans-serif;
        }

        .qr-canvas img {
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center py-10 px-4">

    <div id="loader-view" class="flex flex-col items-center justify-center mt-20 animate-pulse">
        <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p class="text-gray-500 font-medium">Cargando configuración...</p>
    </div>

    <div id="app-view" class="w-full max-w-2xl hidden animate-in fade-in duration-500">

        <div class="mb-8 text-center">
            <div
                class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600 rounded-xl text-white font-bold text-xl shadow-lg shadow-indigo-200 mb-4">
                CA
            </div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Gestión de WhatsApp</h1>
            <p class="text-gray-500 mt-1 text-sm">Control directo de conexiones del servidor</p>
        </div>

        <div id="slots-container" class="space-y-6"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const locationId = params.get("location_id") || params.get("locationId");

        // Toast Config
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer)
                toast.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        if (!locationId) {
            document.body.innerHTML = `
                <div class="flex items-center justify-center h-screen">
                    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-md mx-4 border border-red-100">
                        <div class="text-red-500 text-5xl mb-4">⚠️</div>
                        <h3 class="text-xl font-bold text-gray-900 mb-2">Falta Identificador</h3>
                        <p class="text-gray-500">No se ha especificado el <code>location_id</code> en la URL.</p>
                    </div>
                </div>`;
        }

        const appView = document.getElementById("app-view");
        const loaderView = document.getElementById("loader-view");
        const container = document.getElementById("slots-container");
        const activeConnections = new Set();
        const connectionIntervals = new Map();
        let ghlUsers = [];

        // --- ICONOS SVG (Lucide style) ---
        const ICONS = {
            edit: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`,
            smartphone: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>`,
            check: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
            trash: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
            qr: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>`
        };

        async function init() {
            try {
                // 1. Configuración
                const confRes = await fetch(`/config?locationId=${locationId}`);
                if (!confRes.ok) throw new Error("Error de conexión");
                const conf = await confRes.json();

                if (conf.is_active === false) {
                    showBlockedScreen(conf.reason);
                    return;
                }

                // 2. Usuarios GHL
                try {
                    const usersRes = await fetch(`/public/ghl-users?locationId=${locationId}`);
                    if (usersRes.ok) ghlUsers = await usersRes.json();
                } catch (e) { console.error("Error usuarios", e); }

                loaderView.style.display = "none";
                appView.style.display = "block";

                const slots = conf.slots || [];
                slots.sort((a, b) => (a.priority || 99) - (b.priority || 99));
                renderSlots(slots);

                setInterval(syncAllSlots, 5000);

            } catch (e) {
                console.error(e);
                loaderView.innerHTML = `
                    <div class="bg-red-50 p-6 rounded-xl border border-red-100 text-center">
                        <p class="text-red-600 font-bold">Error al cargar la configuración.</p>
                        <button onclick="location.reload()" class="mt-4 text-sm text-red-500 hover:underline">Reintentar</button>
                    </div>`;
            }
        }

        function renderSlots(slotsArray) {
            container.innerHTML = "";
            const totalSlots = slotsArray.length;

            if (totalSlots === 0) {
                container.innerHTML = `
                    <div class="bg-white p-10 rounded-2xl border border-gray-200 text-center shadow-sm">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                            ${ICONS.smartphone}
                        </div>
                        <p class="text-gray-500 font-medium">No hay dispositivos configurados para esta ubicación.</p>
                    </div>`;
                return;
            }

            slotsArray.forEach(slot => {
                const i = slot.id;
                const currentName = slot.name || `Dispositivo #${i}`;
                const currentPrio = slot.priority || 99;
                const settings = slot.settings || {};
                const currentAssigned = settings.ghl_assigned_user || "";

                // Selectores de opciones
                let prioOptions = "";
                for (let p = 1; p <= totalSlots; p++) {
                    const selected = p === currentPrio ? 'selected' : '';
                    prioOptions += `<option value="${p}" ${selected}>${p} ${p === 1 ? '(Alta)' : ''}</option>`;
                }
                if (currentPrio > totalSlots) prioOptions += `<option value="${currentPrio}" selected>${currentPrio}</option>`;

                let userOptions = `<option value="">-- Automático --</option>`;
                ghlUsers.forEach(u => {
                    const selected = u.id === currentAssigned ? 'selected' : '';
                    userOptions += `<option value="${u.id}" ${selected}>${u.name}</option>`;
                });

                // HTML Estructura tipo Tarjeta Dashboard
                const html = `
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden transition-all hover:shadow-md group" id="card-${i}" data-slot-id="${i}">
                    
                    <div class="p-5 border-b border-gray-100 flex justify-between items-start bg-gradient-to-r from-gray-50/50 to-white">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 shadow-sm border border-indigo-100">
                                ${ICONS.smartphone}
                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-gray-800 text-lg leading-tight" id="title-text-${i}">${currentName}</h3>
                                    <button onclick="editSlotName(${i})" class="text-gray-400 hover:text-indigo-600 transition p-1 hover:bg-gray-100 rounded-md">
                                        ${ICONS.edit}
                                    </button>
                                </div>
                                <p class="text-xs text-gray-400 font-mono mt-0.5">Slot ID: ${i}</p>
                            </div>
                        </div>
                        <div id="badge-${i}" class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-500 border border-gray-200">
                            Desconectado
                        </div>
                    </div>

                    <div class="p-5">
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Prioridad</label>
                                <select onchange="changePriority(${i}, this.value)" class="w-full text-sm bg-gray-50 border border-gray-200 text-gray-700 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 outline-none transition hover:border-gray-300 cursor-pointer">
                                    ${prioOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Asignado a</label>
                                <select onchange="changeResponsible(${i}, this.value)" class="w-full text-sm bg-gray-50 border border-gray-200 text-gray-700 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 outline-none transition hover:border-gray-300 cursor-pointer">
                                    ${userOptions}
                                </select>
                            </div>
                        </div>

                        <div id="connected-view-${i}" style="display:none" class="animate-in fade-in slide-in-from-bottom-2">
                            <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 flex items-center justify-between mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="bg-emerald-100 p-2 rounded-full text-emerald-600">
                                        ${ICONS.check}
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-emerald-700 uppercase tracking-wide">Sincronizado</p>
                                        <p class="text-lg font-bold text-gray-800 font-mono tracking-tight" id="phone-${i}">...</p>
                                    </div>
                                </div>
                            </div>
                            <button onclick="disconnect(${i})" class="w-full flex items-center justify-center gap-2 py-3 border border-red-200 text-red-600 hover:bg-red-50 font-bold rounded-xl transition text-sm">
                                ${ICONS.trash} Desconectar Dispositivo
                            </button>
                        </div>

                        <div id="disconnected-view-${i}">
                            <button id="btn-${i}" onclick="startConnect(${i})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                                ${ICONS.qr} Vincular WhatsApp
                            </button>
                            
                            <div id="qr-area-${i}" class="hidden flex-col items-center mt-6 p-6 bg-gray-50 rounded-2xl border border-gray-200 relative animate-in zoom-in-95 duration-300">
                                <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500 rounded-t-2xl loading-bar"></div>
                                <p id="msg-${i}" class="text-sm font-medium text-gray-600 mb-4 flex items-center gap-2">
                                    <span class="inline-block w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
                                    Generando código QR...
                                </p>
                                <div id="qr-canvas-${i}" class="qr-canvas bg-white p-3 rounded-xl shadow-sm border border-gray-100"></div>
                                <button onclick="cancelConnect(${i})" class="mt-6 text-sm text-red-500 font-bold hover:text-red-700 hover:underline">
                                    Cancelar vinculación
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;

                container.insertAdjacentHTML('beforeend', html);
                checkStatus(i);
            });
        }

        // --- LÓGICA DE NEGOCIO (Igual que antes pero adaptada) ---

        async function changePriority(slotId, newPriority) {
            try {
                const res = await fetch(`/public/update-slot-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ locationId, slotId, priority: parseInt(newPriority) })
                });
                if (res.ok) setTimeout(() => window.location.reload(), 500);
            } catch (e) { Toast.fire({ icon: 'error', title: 'Error actualizando' }); }
        }

        async function changeResponsible(slotId, userId) {
            try {
                const res = await fetch(`/public/update-slot-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ locationId, slotId, assignedUser: userId })
                });
                if (res.ok) Toast.fire({ icon: 'success', title: 'Responsable guardado' });
            } catch (e) { Toast.fire({ icon: 'error', title: 'Error guardando' }); }
        }

        async function editSlotName(slot) {
            const currentName = document.getElementById(`title-text-${slot}`).textContent.trim();
            const { value: newName } = await Swal.fire({
                title: 'Renombrar Dispositivo',
                input: 'text',
                inputValue: currentName,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#4f46e5',
                customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl', cancelButton: 'rounded-xl' }
            });

            if (newName && newName !== currentName) {
                document.getElementById(`title-text-${slot}`).textContent = newName;
                await fetch("/config-slot", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ locationId, slot, slotName: newName })
                });
                Toast.fire({ icon: 'success', title: 'Nombre actualizado' });
            }
        }

        function syncAllSlots() {
            document.querySelectorAll('[data-slot-id]').forEach(card => {
                const slotId = card.getAttribute('data-slot-id');
                if (slotId && !activeConnections.has(parseInt(slotId))) checkStatus(slotId);
            });
        }

        async function checkStatus(slot) {
            try {
                const res = await fetch(`/status?locationId=${locationId}&slot=${slot}`);
                const data = await res.json();
                updateUI(slot, data.connected, data.myNumber);
            } catch (e) { }
        }

        function updateUI(slot, isConnected, phone) {
            const badge = document.getElementById(`badge-${slot}`);
            if (!badge) return;

            const viewCon = document.getElementById(`connected-view-${slot}`);
            const viewDisc = document.getElementById(`disconnected-view-${slot}`);
            const phoneText = document.getElementById(`phone-${slot}`);
            const qrArea = document.getElementById(`qr-area-${slot}`);

            if (isConnected) {
                if (badge.innerText !== "ACTIVO") {
                    badge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-sm";
                    badge.innerText = "ACTIVO";
                    badge.innerHTML = `<span class="inline-block w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 mb-0.5"></span> ACTIVO`;

                    viewCon.style.display = "block";
                    viewDisc.style.display = "none";
                    qrArea.classList.add("hidden");
                    qrArea.classList.remove("flex");
                    activeConnections.delete(slot);
                }
                phoneText.textContent = "+" + phone;
            } else {
                if (badge.innerText !== "DESCONECTADO" && !activeConnections.has(slot)) {
                    badge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-500 border border-gray-200";
                    badge.innerText = "DESCONECTADO";
                    viewCon.style.display = "none";
                    viewDisc.style.display = "block";
                }
            }
        }

        async function startConnect(slot) {
            activeConnections.add(slot);
            const btn = document.getElementById(`btn-${slot}`);
            const qrArea = document.getElementById(`qr-area-${slot}`);
            const qrCanvas = document.getElementById(`qr-canvas-${slot}`);

            btn.classList.add("hidden");
            qrArea.classList.remove("hidden");
            qrArea.classList.add("flex");
            qrCanvas.innerHTML = "";

            try {
                const res = await fetch(`/start-whatsapp?locationId=${locationId}&slot=${slot}`, { method: "POST" });
                if (!res.ok) throw new Error("Fallo inicio");

                const localInterval = setInterval(async () => {
                    if (!document.getElementById(`card-${slot}`)) { clearInterval(localInterval); return; }

                    const s = await fetch(`/status?locationId=${locationId}&slot=${slot}`).then(r => r.json());
                    if (s.connected) {
                        clearInterval(localInterval);
                        connectionIntervals.delete(slot);
                        activeConnections.delete(slot);
                        window.location.reload();
                        return;
                    }

                    const q = await fetch(`/qr?locationId=${locationId}&slot=${slot}`).then(r => r.json());
                    if (q.qr && qrCanvas.innerHTML === "") {
                        document.getElementById(`msg-${slot}`).innerHTML = "Escanea este código con WhatsApp";
                        new QRCode(qrCanvas, { text: q.qr, width: 220, height: 220, colorDark: "#111827", colorLight: "#ffffff" });
                    }
                }, 2000);

                connectionIntervals.set(slot, localInterval);

            } catch (e) {
                activeConnections.delete(slot);
                btn.classList.remove("hidden");
                qrArea.classList.add("hidden");
                qrArea.classList.remove("flex");
                Toast.fire({ icon: 'error', title: 'Error de conexión' });
            }
        }

        async function disconnect(slot) {
            const result = await Swal.fire({
                title: '¿Desconectar?',
                text: "El bot dejará de funcionar en este número.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#9ca3af',
                confirmButtonText: 'Sí, desconectar',
                cancelButtonText: 'Cancelar',
                customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-xl', cancelButton: 'rounded-xl' }
            });

            if (!result.isConfirmed) return;

            try {
                await fetch(`/remove-slot?locationId=${locationId}&slot=${slot}`, { method: "POST" });
                window.location.reload();
            } catch (e) { Toast.fire({ icon: 'error', title: 'Error al desconectar' }); }
        }

        async function cancelConnect(slot) {
            const interval = connectionIntervals.get(slot);
            if (interval) { clearInterval(interval); connectionIntervals.delete(slot); }
            activeConnections.delete(slot);

            document.getElementById(`qr-area-${slot}`).classList.add("hidden");
            document.getElementById(`qr-area-${slot}`).classList.remove("flex");
            document.getElementById(`qr-canvas-${slot}`).innerHTML = "";
            document.getElementById(`btn-${slot}`).classList.remove("hidden");

            await fetch(`/remove-slot?locationId=${locationId}&slot=${slot}`, { method: "POST" });
        }

        function showBlockedScreen(reason) {
            let msg = "Su cuenta no está activa.";
            if (reason === "trial_expired") msg = "Su periodo de prueba ha finalizado.";
            else if (reason === "subscription_inactive") msg = "Suscripción inactiva o cancelada.";

            document.body.innerHTML = `
            <div class="fixed inset-0 bg-gray-100 flex items-center justify-center p-6">
                <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center border border-gray-200">
                    <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500 text-4xl">🔒</div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">Acceso Restringido</h2>
                    <p class="text-gray-500 mb-6">${msg}</p>
                    <a href="https://wa.clicandapp.com" class="block w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">Contactar Soporte</a>
                </div>
            </div>`;
        }

        init();
    </script>
</body>

</html>
